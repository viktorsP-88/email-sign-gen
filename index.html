<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Signature HTML Generator — Final</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <div class="wrap">
      <div class="layout">
        <div class="left-col">
          <section class="panel">
            <div class="panel-head">
              <h2>Ievaddati</h2>
            </div>
            <div class="panel-body">
              <div class="form-grid">
                <div class="field filebox span-2">
                  <label>Logo</label>
                  <div class="logo-mode-grid">
                    <label class="logo-option">
                      <input type="radio" name="logoMode" value="full" checked />
                      <span class="logo-option-card">
                        <span class="logo-swatch"><img id="logoFullPreview" alt="Pilns logo" /></span>
                        <span class="logo-option-title">Pilns logo</span>
                        <span class="logo-option-help">Pēc noklusējuma izmanto pilno logo.</span>
                      </span>
                    </label>
                    <label class="logo-option">
                      <input type="radio" name="logoMode" value="symbol" />
                      <span class="logo-option-card">
                        <span class="logo-swatch"><img id="logoSymbolPreview" alt="P simbols" /></span>
                        <span class="logo-option-title">Tikai P simbols</span>
                        <span class="logo-option-help">Izmanto tikai simbolu no logo.</span>
                      </span>
                    </label>
                    <label class="logo-option">
                      <input type="radio" name="logoMode" value="custom" />
                      <span class="logo-option-card">
                        <span class="logo-swatch"><span style="font-size:12px;color:#6f7890;">Custom</span></span>
                        <span class="logo-option-title">Augšupielādēt custom</span>
                        <span class="logo-option-help">Vari izmantot savu PNG, SVG, JPG vai WEBP logo.</span>
                      </span>
                    </label>
                  </div>
                  <div id="customLogoBox">
                    <input id="logoFile" type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp" />
                    <div id="logoMeta" class="file-meta">Fails nav izvēlēts</div>
                  </div>
                </div>

                <div class="field span-2">
                  <div class="settings-box">
                    <div class="settings-head">
                      <h3>Logo uzstādījumi</h3>
                      <button class="btn btn-secondary" id="resetLogoDefaultsBtn" type="button">Reset to defaults</button>
                    </div>

                    <div class="form-grid">
                      <div class="field">
                        <label for="logoWidth">Logo izmērs</label>
                        <div class="size-input-wrap">
                          <input id="logoWidth" type="number" min="20" max="400" step="1" value="134" />
                          <span class="size-unit">px platums</span>
                        </div>
                        <div id="logoSizeInfo" class="help">Pašlaik: 134 px plats logo. Tiek izmantots noklusējuma pilnais logo.</div>
                      </div>

                      <div class="field">
                        <label>Vertikālais izlīdzinājums</label>
                        <div class="align-options">
                          <label class="align-option">
                            <input type="radio" name="logoAlign" value="top" checked />
                            <span class="align-option-card">Augšā</span>
                          </label>
                          <label class="align-option">
                            <input type="radio" name="logoAlign" value="middle" />
                            <span class="align-option-card">Pa vidu</span>
                          </label>
                          <label class="align-option">
                            <input type="radio" name="logoAlign" value="bottom" />
                            <span class="align-option-card">Apakšā</span>
                          </label>
                        </div>
                      </div>

                      <div class="field">
                        <label for="logoSymbolColor">Logo simbola krāsa</label>
                        <div class="color-controls-grid">
                          <input id="logoSymbolColor" type="text" value="#0E142B" placeholder="#0E142B" />
                          <input id="logoSymbolOpacity" type="number" min="0" max="100" step="1" value="100" />
                        </div>
                        <div class="help">HEX un opacity %.</div>
                      </div>

                      <div class="field">
                        <label for="logoWordmarkColor">Logo wordmark krāsa</label>
                        <div class="color-controls-grid">
                          <input id="logoWordmarkColor" type="text" value="#0E142B" placeholder="#0E142B" />
                          <input id="logoWordmarkOpacity" type="number" min="0" max="100" step="1" value="100" />
                        </div>
                        <div class="help">HEX un opacity %.</div>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="field">
                  <label for="firstName">Vārds</label>
                  <input id="firstName" type="text" value="Jānis" />
                </div>

                <div class="field">
                  <label for="lastName">Uzvārds</label>
                  <input id="lastName" type="text" value="Bērziņš" />
                </div>

                <div class="field">
                  <label for="jobTitle">Ieņemamais amats</label>
                  <input id="jobTitle" type="text" value="CEO" />
                </div>

                <div class="field">
                  <label for="phone">Telefons</label>
                  <input id="phone" type="text" value="+371 20000000" />
                </div>

                <div class="field">
                  <label for="website">WWW</label>
                  <input id="website" type="text" value="www.example.com" />
                  <div class="help">Vari ievadīt ar vai bez https://</div>
                </div>

                <div class="field">
                  <label for="linkedinUrl">LinkedIn saite</label>
                  <input id="linkedinUrl" type="text" value="https://www.linkedin.com/in/example/" />
                </div>

                <div class="field span-2" id="addressField">
                  <div class="toggle-row">
                    <label for="address">Adrese</label>
                    <label class="switch" aria-label="Rādīt adresi">
                      <input id="addressEnabled" type="checkbox" checked />
                      <span class="slider"></span>
                    </label>
                  </div>
                  <input id="address" type="text" value="Ganību dambis 24 k-3, Rīga, Latvija" />
                </div>

                <div id="copyStatus" class="status">Paraksts atjaunojas automātiski.</div>
              </div>
            </div>
          </section>
        </div>

        <div class="right-col">
          <section class="panel">
            <div class="panel-head">
              <div class="preview-head-inner">
                <h2>Preview</h2>
                <label class="preview-mode-toggle">
                  <span>Dark mode</span>
                  <input id="previewDarkToggle" type="checkbox" />
                </label>
              </div>
            </div>
            <div class="preview-shell">
              <div class="preview-stage">
                <div id="preview"></div>
              </div>

              <div class="copy-actions">
                <button class="btn" id="copyOutlookBtn" type="button">
                  <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="5" width="11" height="14" rx="2" fill="currentColor" opacity=".28"/>
                    <path d="M14 7h5a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M7.2 10.2 10 12l-2.8 1.8M11.7 10.2 8.9 12l2.8 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  <span>Outlook</span>
                </button>

                <button class="btn btn-secondary" id="copyGmailBtn" type="button">
                  <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 7.5 12 13l8-5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5.5 6h13A1.5 1.5 0 0 1 20 7.5v9A1.5 1.5 0 0 1 18.5 18h-13A1.5 1.5 0 0 1 4 16.5v-9A1.5 1.5 0 0 1 5.5 6Z" stroke="currentColor" stroke-width="1.8"/>
                  </svg>
                  <span>Gmail</span>
                </button>

                <button class="btn btn-secondary" id="copyAppleBtn" type="button">
                  <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M14.5 5.1c.6-.8 1-1.8.9-2.8-1 .1-2.1.7-2.7 1.5-.6.7-1 1.7-.9 2.7 1 .1 2-.5 2.7-1.4Z" fill="currentColor"/>
                    <path d="M16.9 12.6c0-2 1.6-3 1.6-3-1-.8-2.4-.9-2.9-.9-1.2-.1-2.3.7-3 .7-.7 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.2 2-.6 1.2-.6 3.6.5 5.4.6 1 1.4 2.1 2.4 2 .9 0 1.3-.6 2.4-.6 1.1 0 1.5.6 2.4.5 1-.1 1.6-.9 2.2-1.9.7-1.1 1-2.3 1-2.4-.1 0-.8-.3-1.4-1-.5-.6-.9-1.4-.9-2.1Z" fill="currentColor"/>
                  </svg>
                  <span>Apple Mail</span>
                </button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Paraksts nokopēts</div>

    <script src="script.js" defer></script>
</body>
</html>
